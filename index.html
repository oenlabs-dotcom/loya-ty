<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stamp Loyalty Enterprise</title>
    <!-- Tailwind CSS CDN -->

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- QRCode.js untuk Generate QR Code Pelanggan -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- ZXing Library untuk Scan QR Code via Kamera -->
    <script type="text/javascript" src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
    <!-- SheetJS untuk Export Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fef2f2',
                            100: '#fee2e2',

                            600: '#dc2626',
                            700: '#b91c1c',
                            800: '#991b1b',

                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col pb-16 md:pb-0">

    <!-- Notifikasi Toast -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Modal Container -->
    <div id="modal-container" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4"></div>

    <!-- Container Utama Aplikasi -->
    <div id="app" class="flex-1 flex flex-col">
        <div class="flex items-center justify-center h-screen bg-brand-900 text-white">
            <div class="text-center">
                <i class="fas fa-spinner fa-spin text-4xl mb-4"></i>
                <p class="text-lg font-medium">Memuat Sistem Stamp Loyalty...</p>
            </div>
        </div>
    </div>

    <!-- Firebase & Logika Utama -->
    <script type="module">
        // ==========================================
        // KONFIGURASI APLIKASI & FIREBASE
        // ==========================================
        const IS_PREVIEW = false; // Ubah ke true jika ingin menguji dengan data dummy lokal

        const firebaseConfig = {
            apiKey: "AIzaSyAqo4N8uGmS7NaEfLfWsKgRH6mIJzN_Jzs",
            authDomain: "loyalty-c750b.firebaseapp.com",
            projectId: "loyalty-c750b",
            storageBucket: "loyalty-c750b.firebasestorage.app",
            messagingSenderId: "312172071219",
            appId: "1:312172071219:web:d4e7def898a3375429d646"
        };

        // Import Firebase SDK (Modular v10+)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, doc, getDoc, setDoc, updateDoc, deleteDoc, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        let app, auth, db;
        if (!IS_PREVIEW) {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        }

        // State Aplikasi
        let currentUser = null; 
        let userRole = null; 
        let currentTab = 'dashboard';
        let customerTab = 'stamp'; // 'stamp', 'referrals', 'history', 'rewards', 'profile'
        let codeReader = null; 
        let unsubCustomers = null;
        let unsubTransactions = null;

        let state = {
            settings: { storeName: "Kopi Merah Nusantara", maxStamps: 10, expiryDays: 90, referralBonus: 2, birthdayBonus: 3 },
            branches: [{ id: "branch-1", name: "Cabang Utama (Pusat)", active: true }],
            admins: [
                { id: "adm-1", email: "admin@merah.com", name: "Super Admin", role: "admin", permissions: ["dashboard", "scan", "customers", "rewards", "transactions", "staff", "settings", "announcements"] }
            ],
            customers: [],
            rewards: [
                { id: "rew-1", title: "Kopi Susu Signature Gratis", requiredStamps: 5, description: "Tukar 5 stamp untuk 1 cup kopi susu signature ukuran regular.", active: true },
                { id: "rew-2", title: "Merchandise Tumbler Eksklusif", requiredStamps: 10, description: "Tukar 10 stamp untuk tumbler edisi terbatas.", active: true }
            ],
            transactions: [],
            announcements: [
                { id: "ann-1", title: "Promo Spesial Akhir Pekan!", content: "Dapatkan ekstra 2 stamp untuk setiap pembelian di atas Rp 50.000 setiap hari Sabtu & Minggu.", date: "2026-03-30", active: true }
            ]
        };

        // Utils & Notifikasi
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if(!container) return;
            const toast = document.createElement('div');
            const bg = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-red-600' : 'bg-amber-600';
            toast.className = `${bg} text-white px-4 py-3 rounded-xl shadow-lg text-sm font-medium flex items-center gap-3 transition transform translate-y-2 opacity-0 pointer-events-auto`;
            toast.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'} text-lg"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 50);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function showSuccessModal(title, message, onOk) {
            const modal = document.getElementById('modal-container');
            if(!modal) return;
            modal.classList.remove('hidden');
            modal.innerHTML = `
                <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl text-center space-y-4">
                    <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-2xl">
                        <i class="fas fa-check"></i>
                    </div>
                    <h3 class="font-bold text-slate-900 text-lg">${title}</h3>
                    <p class="text-xs text-slate-600 leading-relaxed whitespace-pre-line">${message}</p>
                    <button id="modal-ok-btn" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-3 rounded-xl text-xs transition shadow-lg shadow-brand-500/25">OK</button>
                </div>
            `;
            document.getElementById('modal-ok-btn').onclick = () => {
                closeModal();
                if(typeof onOk === 'function') onOk();
            };
        }

        function calculateTier(lifetimeStamps) {
            if (lifetimeStamps >= 30) return 'VIP';
            if (lifetimeStamps >= 15) return 'Gold';
            return 'Silver';
        }

        function checkStampExpirations() {
            const expiryDays = state.settings.expiryDays || 90;
            const now = new Date();
            state.customers.forEach(cust => {
                if (cust.lastVisit && cust.stamps > 0) {
                    const lastVisitDate = new Date(cust.lastVisit);
                    const diffTime = now - lastVisitDate;
                    const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                    if (diffDays > expiryDays) {
                        cust.stamps = 0; 
                    }
                }
            });
        }

        // Realtime Listeners Firestore
        function setupRealtimeListeners() {
            if (IS_PREVIEW) return;
            if (unsubCustomers) unsubCustomers();
            if (unsubTransactions) unsubTransactions();

            import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js").then(({ onSnapshot, collection }) => {
                unsubCustomers = onSnapshot(collection(db, "customers"), (snapshot) => {
                    state.customers = [];
                    snapshot.forEach(d => state.customers.push({ id: d.id, ...d.data() }));
                    
                    if (currentUser && userRole === 'customer') {
                        const updatedMe = state.customers.find(c => c.id === currentUser.id);
                        if (updatedMe) {
                            const oldStamps = currentUser.stamps;
                            currentUser = updatedMe;
                            localStorage.setItem('loyalty_customer_session', JSON.stringify(currentUser));
                            
                            if (updatedMe.stamps > oldStamps) {
                                const addedCount = updatedMe.stamps - oldStamps;
                                showSuccessModal("Stampel Baru Ditambahkan!", `Yeay! Anda baru saja mendapatkan +${addedCount} stampel.\nTotal stamp aktif Anda saat ini: ${updatedMe.stamps}/${state.settings.maxStamps}`);
                            }
                            renderApp();
                        }
                    } else if (currentUser && userRole !== 'customer') {
                        renderApp();
                    }
                }, (error) => {
                    console.warn("Realtime customers listener warning:", error);
                });

                unsubTransactions = onSnapshot(collection(db, "transactions"), (snapshot) => {
                    state.transactions = [];
                    snapshot.forEach(d => state.transactions.push({ id: d.id, ...d.data() }));
                    if (currentUser) {
                        renderApp();
                    }
                }, (error) => {
                    console.warn("Realtime transactions listener warning:", error);
                });
            });
        }

        let isDataLoaded = false;
        async function loadFirestoreData() {
            if (IS_PREVIEW || isDataLoaded) return;
            try {
                const setDocSnap = await getDoc(doc(db, "settings", "general"));
                if (setDocSnap.exists()) {
                    state.settings = setDocSnap.data();
                } else {
                    await setDoc(doc(db, "settings", "general"), state.settings);
                }

                const custSnap = await getDocs(collection(db, "customers"));
                state.customers = [];
                custSnap.forEach(d => state.customers.push({ id: d.id, ...d.data() }));

                const rewSnap = await getDocs(collection(db, "rewards"));
                if (!rewSnap.empty) {
                    state.rewards = [];
                    rewSnap.forEach(d => state.rewards.push({ id: d.id, ...d.data() }));
                }

                const trxSnap = await getDocs(collection(db, "transactions"));
                state.transactions = [];
                trxSnap.forEach(d => state.transactions.push({ id: d.id, ...d.data() }));

                const annSnap = await getDocs(collection(db, "announcements"));
                if (!annSnap.empty) {
                    state.announcements = [];
                    annSnap.forEach(d => state.announcements.push({ id: d.id, ...d.data() }));
                }

                const admSnap = await getDocs(collection(db, "admins"));
                if (!admSnap.empty) {
                    state.admins = [];
                    admSnap.forEach(d => state.admins.push({ id: d.id, ...d.data() }));
                }
                isDataLoaded = true;
                setupRealtimeListeners();
            } catch (err) {
                console.error("Gagal memuat data Firestore:", err);
            }
        }

        async function initApp() {
            if (!IS_PREVIEW) {
                const savedCustomerSession = localStorage.getItem('loyalty_customer_session');
                if (savedCustomerSession) {
                    try {
                        const parsedCust = JSON.parse(savedCustomerSession);
                        currentUser = parsedCust;
                        userRole = 'customer';
                    } catch(e) {}
                }

                await loadFirestoreData();

                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        const foundAdmin = state.admins.find(a => a.email === user.email) || {
                            id: user.uid,
                            email: user.email,
                            name: user.displayName || "Admin Toko",
                            role: "admin",
                            permissions: ["dashboard", "scan", "customers", "rewards", "transactions", "staff", "settings", "announcements"]
                        };
                        currentUser = foundAdmin;
                        userRole = foundAdmin.role || 'admin';
                    } else if (!currentUser || userRole !== 'customer') {
                        if (!localStorage.getItem('loyalty_customer_session')) {
                            currentUser = null;
                            userRole = null;
                        }
                    }
                    checkStampExpirations();
                    renderApp();
                });
            } else {
                checkStampExpirations();
                renderApp();
            }
        }

        function renderApp() {
            const appEl = document.getElementById('app');
            if (!appEl) return;
            if (!currentUser) {
                appEl.innerHTML = renderAuthScreen();
                setupAuthListeners();
            } else if (userRole === 'customer') {
                appEl.innerHTML = renderCustomerPortal();
                setupCustomerListeners();
                // Render QR code on desktop portal
                setTimeout(() => {
                    const qrEl = document.getElementById('customer-qr-desktop');
                    if (qrEl) {
                        qrEl.innerHTML = '';
                        new QRCode(qrEl, {
                            text: currentUser.barcodeId,
                            width: 130,
                            height: 130,
                            colorDark: "#000000",
                            colorLight: "#ffffff",
                            correctLevel: QRCode.CorrectLevel.H
                        });
                    }
                }, 50);
            } else {
                appEl.innerHTML = renderAdminDashboard();
                setupAdminListeners();
            }
        }

        // 1. Autentikasi
        function renderAuthScreen() {
            const urlParams = new URLSearchParams(window.location.search);
            const refCode = urlParams.get('ref') || '';

            return `
            <div class="min-h-screen bg-gradient-to-br from-brand-900 via-brand-800 to-slate-900 flex items-center justify-center p-4">
                <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden p-8">
                    <div class="text-center mb-6">
                        <div class="w-16 h-16 bg-brand-100 text-brand-600 rounded-2xl flex items-center justify-center mx-auto mb-3 text-2xl shadow-inner">
                            <i class="fas fa-stamp"></i>
                        </div>
                        <h1 class="text-2xl font-bold text-slate-900">Stamp Loyalty</h1>
                        <p class="text-sm text-slate-500">Sistem Loyalitas Pelanggan & Rewards</p>
                    </div>

                    <div class="flex bg-slate-100 p-1 rounded-xl mb-6">
                        <button id="tab-login-btn" onclick="switchAuthTab('login')" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-white text-brand-600 shadow-sm transition">Masuk</button>
                        <button id="tab-register-btn" onclick="switchAuthTab('register')" class="flex-1 py-2 text-sm font-semibold rounded-lg text-slate-500 hover:text-slate-900 transition">Daftar Member</button>
                    </div>

                    <div id="form-login-container">
                        <form id="login-form" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">No. HP (Member)</label>
                                <input type="text" id="login-identifier" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-brand-500 text-sm" placeholder="••••••••">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Password</label>
                                <input type="password" id="login-password" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-brand-500 text-sm" placeholder="••••••••">
                            </div>
                            <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-brand-500/25">Masuk ke Sistem</button>
                        </form>
                    </div>

                    <div id="form-register-container" class="hidden">
                        <form id="register-form" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Nama Lengkap</label>
                                <input type="text" id="reg-name" required class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-brand-500 text-sm" placeholder="Nama Anda">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Nomor WhatsApp / HP</label>
                                <input type="text" id="reg-phone" required class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-brand-500 text-sm" placeholder="08xxxxxxxxxx">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Tanggal Lahir</label>
                                <input type="date" id="reg-birth" required class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-brand-500 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Password</label>
                                <input type="password" id="reg-password" required class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-brand-500 text-sm" placeholder="••••••••">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Kode Referral (Opsional)</label>
                                <input type="text" id="reg-referral" value="${refCode}" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-brand-500 text-sm uppercase" placeholder="Contoh: BUDI123">
                            </div>
                            <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-brand-500/25">Daftar Sekarang</button>
                        </form>
                    </div>
                </div>
            </div>`;
        }

        function setupAuthListeners() {
            window.switchAuthTab = (tab) => {
                const loginBtn = document.getElementById('tab-login-btn');
                const regBtn = document.getElementById('tab-register-btn');
                const loginForm = document.getElementById('form-login-container');
                const regForm = document.getElementById('form-register-container');
                if(!loginBtn || !regBtn) return;

                if (tab === 'login') {
                    loginBtn.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-white text-brand-600 shadow-sm transition";
                    regBtn.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-slate-500 hover:text-slate-900 transition";
                    loginForm.classList.remove('hidden');
                    regForm.classList.add('hidden');
                } else {
                    regBtn.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-white text-brand-600 shadow-sm transition";
                    loginBtn.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-slate-500 hover:text-slate-900 transition";
                    regForm.classList.remove('hidden');
                    loginForm.classList.add('hidden');
                }
            };

            const loginFormEl = document.getElementById('login-form');
            if (loginFormEl) {
                loginFormEl.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const identifier = document.getElementById('login-identifier').value.trim();
                    const password = document.getElementById('login-password').value;

                    if (IS_PREVIEW) {
                        let foundAdmin = state.admins.find(a => a.email === identifier && password === '123');
                        if (foundAdmin) {
                            currentUser = foundAdmin;
                            userRole = foundAdmin.role;
                            showToast(`Selamat datang, ${foundAdmin.name}!`);
                            renderApp();
                            return;
                        }
                        let foundCust = state.customers.find(c => c.phone === identifier && c.password === password);
                        if (foundCust) {
                            currentUser = foundCust;
                            userRole = 'customer';
                            localStorage.setItem('loyalty_customer_session', JSON.stringify(foundCust));
                            showToast(`Selamat datang, ${foundCust.name}!`);
                            renderApp();
                            return;
                        }
                        showToast('Login gagal! Periksa kembali email/no HP dan password.', 'error');
                    } else {
                        try {
                            const userCred = await signInWithEmailAndPassword(auth, identifier, password);
                            const foundAdmin = state.admins.find(a => a.email === identifier) || {
                                id: userCred.user.uid,
                                email: identifier,
                                name: "Admin Toko",
                                role: "admin",
                                permissions: ["dashboard", "scan", "customers", "rewards", "transactions", "staff", "settings", "announcements"]
                            };
                            currentUser = foundAdmin;
                            userRole = foundAdmin.role || 'admin';
                            showToast(`Selamat datang, ${currentUser.name}!`);
                            renderApp();
                            return;
                        } catch (err) {
                            let foundCust = state.customers.find(c => c.phone === identifier && c.password === password);
                            if (foundCust) {
                                currentUser = foundCust;
                                userRole = 'customer';
                                localStorage.setItem('loyalty_customer_session', JSON.stringify(foundCust));
                                showToast(`Selamat datang, ${foundCust.name}!`);
                                renderApp();
                                return;
                            }
                            showToast('Login gagal: Email/No HP atau password salah.', 'error');
                        }
                    }
                });
            }

            const regFormEl = document.getElementById('register-form');
            if (regFormEl) {
                regFormEl.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const name = document.getElementById('reg-name').value.trim();
                    const phone = document.getElementById('reg-phone').value.trim();
                    const birthDate = document.getElementById('reg-birth').value;
                    const password = document.getElementById('reg-password').value;
                    const referralInput = document.getElementById('reg-referral').value.trim().toUpperCase();

                    if (state.customers.some(c => c.phone === phone)) {
                        showToast('Nomor HP sudah terdaftar!', 'error');
                        return;
                    }

                    const newId = 'cust-' + Date.now();
                    const barcodeId = 'CUST-' + phone;
                    const referralCode = name.substring(0, 3).toUpperCase() + Math.floor(100 + Math.random() * 900);
                    const joinDateISO = new Date().toISOString().split('T')[0];

                    let initialStamps = 0;
                    let referrerFoundName = null;

                    if (referralInput) {
                        const referrer = state.customers.find(c => c.referralCode === referralInput);
                        if (referrer) {
                            referrerFoundName = referrer.name;
                            referrer.stamps += state.settings.referralBonus;
                            referrer.lifetimeStamps += state.settings.referralBonus;
                            referrer.tier = calculateTier(referrer.lifetimeStamps);
                            
                            const refTrx = {
                                id: 'trx-' + Date.now(),
                                customerId: referrer.id,
                                branchId: 'branch-1',
                                type: 'REFERRAL_BONUS',
                                stampsCount: state.settings.referralBonus,
                                amount: 0,
                                note: `Bonus Referral dari pendaftaran member baru: ${name}`,
                                adminEmail: 'System Referral',
                                timestamp: new Date().toISOString()
                            };
                            state.transactions.push(refTrx);

                            if (!IS_PREVIEW) {
                                await updateDoc(doc(db, "customers", referrer.id), {
                                    stamps: referrer.stamps,
                                    lifetimeStamps: referrer.lifetimeStamps,
                                    tier: referrer.tier
                                });
                                await setDoc(doc(db, "transactions", refTrx.id), refTrx);
                            }
                        }
                    }

                    const newCustomer = {
                        id: newId,
                        phone,
                        name,
                        password,
                        barcodeId,
                        stamps: initialStamps,
                        lifetimeStamps: initialStamps,
                        tier: calculateTier(initialStamps),
                        lastVisit: new Date().toISOString(),
                        birthDate,
                        referralCode,
                        referredBy: referralInput,
                        joinDate: joinDateISO
                    };

                    if (!IS_PREVIEW) {
                        await setDoc(doc(db, "customers", newId), newCustomer);
                    }

                    state.customers.push(newCustomer);
                    currentUser = newCustomer;
                    userRole = 'customer';
                    localStorage.setItem('loyalty_customer_session', JSON.stringify(newCustomer));
                    
                    if (referrerFoundName) {
                        showToast(`Registrasi berhasil! Berhasil menggunakan kode referral dari ${referrerFoundName}.`);
                    } else {
                        showToast('Registrasi berhasil! Akun Anda telah aktif.');
                    }
                    renderApp();
                });
            }
        }

        // 2. Portal Pelanggan
        function renderCustomerPortal() {
            const activeAnnouncements = state.announcements.filter(a => a.active);
            const myReferredList = state.customers.filter(c => c.referredBy === currentUser.referralCode);

        function setupCustomerListeners() {
            window.switchCustomerTab = (tab) => {
                customerTab = tab;
                renderApp();
            };

            const logoutDesktop = document.getElementById('logout-btn-desktop');
            const logoutMobile = document.getElementById('logout-btn-mobile');
            const handleLogout = async () => {
                localStorage.removeItem('loyalty_customer_session');
                if (!IS_PREVIEW) await signOut(auth);
                currentUser = null;
                userRole = null;
                renderApp();
            };

            if(logoutDesktop) logoutDesktop.onclick = handleLogout;
            if(logoutMobile) logoutMobile.onclick = handleLogout;

            window.openQrModal = () => {
                const modal = document.getElementById('modal-container');
                modal.classList.remove('hidden');
                modal.innerHTML = `
                    <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl text-center space-y-4">
                        <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                            <h3 class="font-bold text-slate-900 text-sm">QR Code Keanggotaan</h3>
                            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times text-base"></i></button>
                        </div>
                        <p class="text-xs text-slate-500">Tunjukkan QR Code ini kepada kasir saat bertransaksi.</p>
                        <div id="modal-qrcode-container" class="bg-slate-50 p-4 rounded-2xl border border-slate-200 inline-block mx-auto"></div>
                        <div class="p-2 bg-brand-50 text-brand-800 font-mono text-xs font-bold rounded-lg inline-block">
                            ${currentUser.barcodeId}
                        </div>
                        <button onclick="closeModal()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-2.5 rounded-xl text-xs transition">Tutup</button>
                    </div>
                `;

                new QRCode(document.getElementById('modal-qrcode-container'), {
                    text: currentUser.barcodeId,
                    width: 160,
                    height: 160,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });
            };

            window.claimReward = async (rewardId) => {
                const reward = state.rewards.find(r => r.id === rewardId);
                if (!reward) return;
                if (currentUser.stamps < reward.requiredStamps) {
                    showToast('Stamp Anda belum mencukupi untuk klaim reward ini.', 'error');
                    return;
                }

                currentUser.stamps -= reward.requiredStamps;
                const newTrx = {
                    id: 'trx-' + Date.now(),
                    customerId: currentUser.id,
                    branchId: 'branch-1',
                    type: 'REDEEM_REWARD',
                    stampsCount: -reward.requiredStamps,
                    amount: 0,
                    note: `Klaim Reward: ${reward.title}`,
                    adminEmail: 'Self Customer',
                    timestamp: new Date().toISOString()
                };

                state.transactions.push(newTrx);

                if (!IS_PREVIEW) {
                    await updateDoc(doc(db, "customers", currentUser.id), { stamps: currentUser.stamps });
                    await setDoc(doc(db, "transactions", newTrx.id), newTrx);
                }

                localStorage.setItem('loyalty_customer_session', JSON.stringify(currentUser));
                showSuccessModal("Klaim Reward Berhasil!", `Anda berhasil menukar reward: ${reward.title}. Silakan tunjukkan layar ini kepada kasir.`);
                renderApp();
            };
        }

                renderApp();

            if (adminLogoutBtn) adminLogoutBtn.onclick = handleAdminLogout;

                const startBtn = document.getElementById('start-scan-btn');

                if (startBtn) {
                    startBtn.addEventListener('click', () => {
                        try {
                            codeReader = new ZXing.BrowserQRCodeReader();
                            codeReader.decodeFromVideoDevice(undefined, 'video', (result, err) => {
                                if (result) {
                                    handleScannedCode(result.text);
                                }

                                console.warn(err);
                                showToast('Gagal mengakses kamera!', 'error');
                            });
                        } catch(e) {
                            showToast('Kamera tidak didukung browser ini.', 'error');
                        }

        window.addStampToCustomer = async (customerId, count) => {
            const customer = state.customers.find(c => c.id === customerId);
            if (!customer) return;

            const amountInput = document.getElementById('stamp-trx-amount');
            const trxAmount = amountInput ? parseFloat(amountInput.value) || 0 : 0;

            customer.stamps += count;
            customer.lifetimeStamps += count;
            customer.tier = calculateTier(customer.lifetimeStamps);
            customer.lastVisit = new Date().toISOString();

            const newTrx = {
                id: 'trx-' + Date.now(),
                customerId: customer.id,
                branchId: 'branch-1',
                type: 'ADD_STAMP',
                stampsCount: count,
                amount: trxAmount,
                note: `Penambahan ${count} stamp (${trxAmount ? 'Rp ' + trxAmount.toLocaleString('id-ID') : ''}) oleh kasir`,
                adminEmail: currentUser.email || 'Admin Toko',
                timestamp: new Date().toISOString()
            };

            state.transactions.push(newTrx);

            if (!IS_PREVIEW) {
                try {
                    await updateDoc(doc(db, "customers", customer.id), {
                        stamps: customer.stamps,
                        lifetimeStamps: customer.lifetimeStamps,
                        tier: customer.tier,
                        lastVisit: customer.lastVisit
                    });
                    await setDoc(doc(db, "transactions", newTrx.id), newTrx);
                } catch(e) {
                    console.error("Gagal update firestore:", e);
                }
            }

            showSuccessModal("Berhasil Memberikan Stampel!", `Berhasil menambahkan ${count} stamp untuk ${customer.name}.\nNominal Transaksi: Rp ${trxAmount.toLocaleString('id-ID')}\nTotal stamp aktif saat ini: ${customer.stamps}/${state.settings.maxStamps}`);
            displayCustomerScanResult(customer);
        };

        window.deleteTransactionLog = async (trxId) => {
            const idx = state.transactions.findIndex(t => t.id === trxId);
            if (idx !== -1) {
                state.transactions.splice(idx, 1);
                if (!IS_PREVIEW) {
                    await deleteDoc(doc(db, "transactions", trxId));
                }
                showToast('Log transaksi berhasil dihapus tanpa mempengaruhi poin pelanggan.');
                renderApp();
            }
        };

        window.deleteTransactionsByDateRange = async () => {
            const startDateEl = document.getElementById('del-start-date');
            const endDateEl = document.getElementById('del-end-date');
            if(!startDateEl || !endDateEl || !startDateEl.value || !endDateEl.value) {
                showToast('Harap pilih rentang tanggal mulai dan selesai terlebih dahulu!', 'error');
                return;
            }

            const start = new Date(startDateEl.value);
            start.setHours(0,0,0,0);
            const end = new Date(endDateEl.value);
            end.setHours(23,59,59,999);

            const toDelete = state.transactions.filter(t => {
                const tDate = new Date(t.timestamp);
                return tDate >= start && tDate <= end;
            });

            state.transactions = state.transactions.filter(t => {
                const tDate = new Date(t.timestamp);
                return tDate < start || tDate > end;
            });

            if (!IS_PREVIEW) {
                for (let trx of toDelete) {
                    await deleteDoc(doc(db, "transactions", trx.id));
                }
            }

            showToast(`Berhasil menghapus log transaksi pada rentang tanggal tersebut tanpa mempengaruhi poin member!`);
            renderApp();
        };

        window.deleteReward = async (rewId) => {
            state.rewards = state.rewards.filter(r => r.id !== rewId);
            if (!IS_PREVIEW) {
                await deleteDoc(doc(db, "rewards", rewId));
            }
            showToast('Reward dihapus.');
            renderApp();
        };

        window.deleteAnnouncement = async (annId) => {
            state.announcements = state.announcements.filter(a => a.id !== annId);
            if (!IS_PREVIEW) {
                await deleteDoc(doc(db, "announcements", annId));
            }
            showToast('Pengumuman dihapus.');
            renderApp();
        };

        window.deleteStaff = async (admId) => {
            state.admins = state.admins.filter(a => a.id !== admId);
            if (!IS_PREVIEW) {
                await deleteDoc(doc(db, "admins", admId));
            }
            showToast('Akun staf dihapus.');
            renderApp();
        };

        window.exportCustomersExcel = () => {
            const wsData = state.customers.map(c => {
                const referredCount = state.customers.filter(ref => ref.referredBy === c.referralCode).length;
                const cTrx = state.transactions.filter(t => t.customerId === c.id && t.type === 'ADD_STAMP');
                const totalSpent = cTrx.reduce((acc, t) => acc + (t.amount || 0), 0);

                return {
                    "ID Member": c.id,
                    "Nama": c.name,
                    "No. HP": c.phone,
                    "Tanggal Join": c.joinDate || '-',
                    "Tier": c.tier,
                    "Stamp Aktif": c.stamps,
                    "Total Belanja (Rp)": totalSpent,
                    "Lifetime Stamp": c.lifetimeStamps,
                    "Total Referral": referredCount,
                    "Kunjungan Terakhir": c.lastVisit ? new Date(c.lastVisit).toLocaleDateString() : '-',
                    "Kode Referral": c.referralCode
                };
            });
            const ws = XLSX.utils.json_to_sheet(wsData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Data Pelanggan");
            XLSX.writeFile(wb, "Laporan_Pelanggan_Loyalty.xlsx");
            showToast('File Excel berhasil di-download!');
        };

        window.addEventListener('DOMContentLoaded', () => {
            initApp();
        });
    </script>
</body>
</html>
